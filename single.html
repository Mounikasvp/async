<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Fetcher</title>
</head>
<body>

  <input type="text" id="category-search" placeholder="Enter category to search">
  <button id="search-products-btn">Search Products</button>
  <button id="load-products-btn">Load Product Titles</button>
  <div id="product-list"></div>

  <div id="product" style="display:none;"></div> <!-- Main div where products are displayed -->

  <script>
    // Function to fetch and display products based on the category
    async function fetchAndDisplayProductsByCategory(category) {
      const response = await fetch("https://dummyjson.com/products");
      const data = await response.json();
      const products = data.products;

      // Filter products by category
      const filteredProducts = products.filter(product => product.category.toLowerCase() === category.toLowerCase());

      return filteredProducts;
    }

    // Function to display the product details
    function displayProductDetails(products) {
      const productListDiv = document.getElementById("product-list");
      productListDiv.innerHTML = ''; // Clear any previous content

      if (products.length === 0) {
        productListDiv.innerHTML = '<p>No products found for this category.</p>';
      }

      products.forEach(product => {
        const productDiv = document.createElement("div");
        productDiv.innerHTML = `
          <h3>Title: ${product.title}</h3>
          <p>Price: ${product.price}</p>
          <p>Category: ${product.category}</p>
          <p>Description: ${product.description}</p>
        `;
        productListDiv.appendChild(productDiv);
      });
    }

    // Function to fetch and display all product titles
    async function fetchAndDisplayProductTitles() {
      const response = await fetch("https://dummyjson.com/products");
      const data = await response.json();
      const products = data.products;

      // Display all titles
      return products.map(product => product.title);
    }

    // Function to display the product titles
    function displayProductTitles(titles) {
      const productListDiv = document.getElementById("product-list");
      productListDiv.innerHTML = ''; // Clear any previous content

      // Display each title
      titles.forEach(title => {
        const productDiv = document.createElement("div");
        productDiv.innerHTML = `<strong>${title}</strong>`;
        productListDiv.appendChild(productDiv);
      });
    }

    // Adding event listener to load product titles on button click
    document.getElementById("load-products-btn").addEventListener("click", async () => {
      const productTitles = await fetchAndDisplayProductTitles();
      displayProductTitles(productTitles);

      // Hide the main div after loading titles
      document.getElementById("product").style.display = "none";
    });

    // Event listener to search products by category
    document.getElementById("search-products-btn").addEventListener("click", async () => {
      const category = document.getElementById("category-search").value.trim();

      if (category) {
        // Fetch and display products for the specific category
        const filteredProducts = await fetchAndDisplayProductsByCategory(category);
        displayProductDetails(filteredProducts);
      } else {
        alert("Please enter a category to search for.");
      }
    });
  </script>

</body>
</html>
